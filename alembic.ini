[alembic]
script_location = alembic
# Não incluir um URL de banco sensível no repositório. Alembic usa a variável de ambiente
# `DATABASE_URL` quando possível (veja `alembic/env.py`). Ajuste a variável de ambiente
# no seu ambiente (Render/Supabase) em vez de editar este arquivo.
sqlalchemy.url = driver://user:pass@localhost/db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
